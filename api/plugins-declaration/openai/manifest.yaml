  zh_Hans: OpenAI 大语言模型，提供多种能力版本，包括 gpt-3.5-turbo（快速）、gpt-4（均衡）和 gpt-4-turbo（强大）。
icon_small: openai_small.svg
icon_small_dark: openai_small.svg
