provider: monyii
label:
  en_US: deepseek
  zh_Hans: 深度求索
description:
  en_US: Models provided by deepseek, such as deepseek-chat, deepseek-coder.
  zh_Hans: 深度求索提供的模型，例如 deepseek-chat、deepseek-coder。
help:
  title:
    en_US: Get your API Key from deepseek
    zh_Hans: 从深度求索获取 API Key
  url:
    en_US: https://platform.deepseek.com/api_keys
icon_small:
  en_US: "_assets/deepseek_small.svg"
icon_small_dark:
  en_US: "_assets/deepseek_small.svg"
icon_large:
  en_US: "_assets/deepseek.svg"
icon_large_dark:
  en_US: "_assets/deepseek.svg"
supported_model_types:
  - llm
configurate_methods:
  - predefined-model
  - customizable-model
extra:
  node:
    module: provider/deepseek.js
    class: DeepseekProvider
    models:
      - "models/llm/llm.js"
model_files:
  - "models/llm/*.yaml"
provider_credential_schema:
  credential_form_schema:
    - variable: api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        zh_Hans: 在此输入您的 API Key
        en_US: Enter your API Key
    - variable: endpoint_url
      label:
        zh_Hans: API 地址
        en_US: API Endpoint
      type: text-input
      required: false
      placeholder:
        zh_Hans: 在此输入您的 API 地址
        en_US: Enter your API Endpoint
